  <style>
    body {

    }

    .video-container {
      width: 90%;

    }

      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px;
    }
  </style>

<body>

  <div class="video-container">
    <video
      id="mainVideo"
      autoplay
      loop
      playsinline
      controls
      preload="metadata">
      Browser Anda tidak mendukung pemutar video.
    </video>
  </div>

  <!-- MENGAMBIL LINK POSTER DAN VIDEO DARI BAGIAN ATAS -->
  <script>
    const posterUrl =
      document.querySelector('meta[name="video-poster"]').content;

    const videoUrl =
      document.querySelector('meta[name="video-source"]').content;

    const video = document.getElementById('mainVideo');

    video.poster = posterUrl;

    const source = document.createElement('source');
    source.src = videoUrl;
    source.type = 'video/mp4';

    video.appendChild(source);
    video.load();
  </script>
